name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: neteye-platform/repo-commons/.github/workflows/build-docker-image.yaml@fd7026206538cfcb618fa7a69197572a16d5a8a0 # main
    secrets: inherit
    with:
      working-directory: "."
      dockerfile-path: "./Dockerfile"
      image-name: ${{ github.event.repository.name }}
      push: true
