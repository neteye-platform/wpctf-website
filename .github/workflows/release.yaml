name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build-and-push:
    permissions:
      contents: read
      packages: write
    uses: neteye-platform/repo-commons/.github/workflows/build-docker-image.yaml@5bc50965d25ad463bce0bce99cc71ecbb99a79d0 # main
    secrets: inherit
    with:
      working-directory: "."
      dockerfile-path: "./Dockerfile"
      image-name: ${{ github.event.repository.name }}
      push: true
