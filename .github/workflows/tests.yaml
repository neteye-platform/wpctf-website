name: E2E Tests

on:
  pull_request:
    branches:
      - "**"

jobs:
  build-docker-image:
    permissions:
      contents: read
      packages: write
    uses: neteye-platform/repo-commons/.github/workflows/build-docker-image.yaml@e8e2d702d7a80fc53886bd28a7ddcbb05906180a # main
    secrets: inherit
    with:
      working-directory: "."
      dockerfile-path: "./Dockerfile"
      image-name: ${{ github.event.repository.name }}
      push: false

  e2e-tests:
    name: E2E Tests
    needs: build-docker-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event.repository.name }}-image
          path: ${{ runner.temp }}/

      - name: Load Docker image
        run: |
          docker load -i ${{ runner.temp }}/image.tar
          docker tag "$(docker images -q | head -1)" wpctf-website:pr

      - name: Start container
        run: docker run -d --name wpctf -p 8080:8080 wpctf-website:pr

      - name: Wait for container to be ready
        run: |
          echo "Waiting for http://127.0.0.1:8080 to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "Container is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - not ready yet, waiting 1s..."
            sleep 1
          done
          echo "Container did not become ready in time"
          docker logs wpctf
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Install Playwright browsers
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: website
        env:
          CI: true
          BASE_URL: http://localhost:8080
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 3

      - name: Stop container
        if: always()
        run: |
          docker stop wpctf
          docker rm wpctf
